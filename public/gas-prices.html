<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U.S. Gas Price Tracker</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
    background: #0f1623;
    color: #e8ecf1;
    padding: 0;
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }

  .widget {
    max-width: 650px;
    margin: 0 auto;
    padding: 24px;
    background: linear-gradient(135deg, #0f1623 0%, #1a2332 100%);
    min-height: 100%;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #64748b;
  }

  .header-icon {
    font-size: 16px;
  }

  /* Local price callout */
  .local-section {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.12) 0%, rgba(139, 92, 246, 0.08) 100%);
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 22px;
    text-align: center;
  }

  .local-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #a5b4fc;
    margin-bottom: 6px;
  }

  .local-price {
    font-size: 40px;
    font-weight: 800;
    color: #c7d2fe;
    line-height: 1.1;
  }

  .local-price .local-unit {
    font-size: 16px;
    font-weight: 600;
    vertical-align: super;
    color: #818cf8;
  }

  .local-change {
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 12px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 700;
  }

  .local-change.up {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
  }

  .local-change.down {
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
  }

  .local-vs {
    font-size: 11px;
    color: #64748b;
    margin-top: 4px;
  }

  /* Big Price */
  .price-section {
    text-align: center;
    margin-bottom: 28px;
  }

  .big-price {
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, #f0f4f8 0%, #c8d6e5 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .big-price .unit {
    font-size: 28px;
    font-weight: 600;
    vertical-align: super;
  }

  .price-subtitle {
    font-size: 13px;
    color: #64748b;
    font-weight: 500;
  }

  /* Comparison Cards */
  .comparisons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }

  .card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    padding: 18px;
    transition: background 0.2s;
  }

  .card:hover {
    background: rgba(255, 255, 255, 0.06);
  }

  .card-label {
    font-size: 11px;
    font-weight: 600;
    color: #8896a7;
    line-height: 1.5;
    margin-bottom: 14px;
    min-height: 50px;
  }

  .card-prices {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-size: 13px;
    color: #94a3b8;
  }

  .card-prices .arrow-connector {
    color: #475569;
  }

  .card-price-val {
    font-weight: 700;
    color: #cbd5e1;
  }

  /* Splashy percentage badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1;
    position: relative;
  }

  .badge.up {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(220, 38, 38, 0.3) 100%);
    color: #fca5a5;
    border: 2px solid rgba(239, 68, 68, 0.3);
    text-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
    box-shadow: 0 0 24px rgba(239, 68, 68, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .badge.down {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.2) 0%, rgba(22, 163, 74, 0.3) 100%);
    color: #86efac;
    border: 2px solid rgba(34, 197, 94, 0.3);
    text-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    box-shadow: 0 0 24px rgba(34, 197, 94, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .badge .arrow {
    font-size: 22px;
  }

  .dollar-change {
    font-size: 12px;
    color: #64748b;
    margin-top: 10px;
    font-weight: 500;
  }

  /* Regions */
  .regions-section {
    margin-bottom: 20px;
  }

  .regions-header {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #64748b;
    margin-bottom: 12px;
  }

  .region-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 4px;
    background: rgba(255, 255, 255, 0.02);
    transition: background 0.2s;
  }

  .region-row:hover {
    background: rgba(255, 255, 255, 0.05);
  }

  .region-name {
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    flex: 1;
  }

  .region-price {
    font-size: 15px;
    font-weight: 700;
    color: #e2e8f0;
    width: 70px;
    text-align: right;
  }

  .region-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
    width: 75px;
    justify-content: center;
    margin-left: 12px;
  }

  .region-badge.up {
    background: rgba(239, 68, 68, 0.12);
    color: #f87171;
  }

  .region-badge.down {
    background: rgba(34, 197, 94, 0.12);
    color: #4ade80;
  }

  /* Footer */
  .footer {
    text-align: center;
    font-size: 10px;
    color: #475569;
    padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.04);
  }

  /* Loading / Error */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #64748b;
  }

  .loading-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: #64748b;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .error-state {
    text-align: center;
    padding: 40px 20px;
    color: #64748b;
  }

  .error-state .error-icon {
    font-size: 32px;
    margin-bottom: 12px;
  }

  /* Animations */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-in {
    animation: fadeInUp 0.4s ease-out forwards;
    opacity: 0;
  }

  @keyframes countUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .price-animate {
    animation: countUp 0.5s ease-out 0.1s forwards;
    opacity: 0;
  }

  @keyframes badgePop {
    0% { transform: scale(0.6); opacity: 0; }
    50% { transform: scale(1.1); }
    70% { transform: scale(0.95); }
    100% { transform: scale(1); opacity: 1; }
  }

  .badge-animate {
    animation: badgePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
    opacity: 0;
  }

  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 24px rgba(239, 68, 68, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
    50% { box-shadow: 0 0 32px rgba(239, 68, 68, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
  }

  @keyframes glowPulseGreen {
    0%, 100% { box-shadow: 0 0 24px rgba(34, 197, 94, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
    50% { box-shadow: 0 0 32px rgba(34, 197, 94, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
  }

  .badge.up.badge-animate {
    animation: badgePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards,
               glowPulse 2s ease-in-out 0.8s infinite;
  }

  .badge.down.badge-animate {
    animation: badgePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards,
               glowPulseGreen 2s ease-in-out 0.8s infinite;
  }

  /* Responsive */
  @media (max-width: 500px) {
    .widget {
      padding: 18px 16px;
    }

    .big-price {
      font-size: 56px;
    }

    .big-price .unit {
      font-size: 22px;
    }

    .comparisons {
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .card-label {
      min-height: auto;
    }

    .badge {
      font-size: 24px;
      padding: 8px 16px;
    }

    .badge .arrow {
      font-size: 18px;
    }

    .local-price {
      font-size: 32px;
    }

    .region-row {
      padding: 8px 10px;
    }

    .region-name {
      font-size: 12px;
    }

    .region-price {
      font-size: 14px;
      width: 60px;
    }

    .region-badge {
      width: 68px;
      font-size: 11px;
      margin-left: 8px;
    }
  }
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div>Loading gas prices&hellip;</div>
  </div>
</div>

<script>
(function() {
  var DATA_URL = './data/gas-prices.json';
  var GEO_URL = 'http://ip-api.com/json/?fields=status,regionName';

  function formatPrice(price) {
    return '$' + price.toFixed(2);
  }

  function formatPct(pct) {
    return Math.abs(pct).toFixed(1) + '%';
  }

  function formatChange(change) {
    var prefix = change >= 0 ? '+' : '-';
    return prefix + '$' + Math.abs(change).toFixed(2);
  }

  function formatDate(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  function pctChange(current, baseline) {
    return ((current - baseline) / baseline) * 100;
  }

  function buildLocalSection(state) {
    var iranPct = pctChange(state.current, state.iranWar);
    var isUp = iranPct >= 0;
    var dirClass = isUp ? 'up' : 'down';
    var arrow = isUp ? '\u2191' : '\u2193';

    return '<div class="local-section animate-in" style="animation-delay: 0.08s">' +
      '<div class="local-label">\uD83D\uDCCD Gas in ' + state.name + '</div>' +
      '<div class="local-price">' + formatPrice(state.current) + '<span class="local-unit">/gal</span></div>' +
      '<div class="local-change ' + dirClass + '">' + arrow + ' ' + formatPct(iranPct) + ' since Iran war</div>' +
      '<div class="local-vs">vs. ' + formatPrice(state.iranWar) + ' regional avg on Feb 27</div>' +
    '</div>';
  }

  function buildComparisonCard(label, baselinePrice, currentPrice, animDelay) {
    var change = currentPrice - baselinePrice;
    var pct = pctChange(currentPrice, baselinePrice);
    var isUp = change >= 0;
    var dirClass = isUp ? 'up' : 'down';
    var arrow = isUp ? '\u2191' : '\u2193';

    return '<div class="card animate-in" style="animation-delay: ' + animDelay + 's">' +
      '<div class="card-label">' + label + '</div>' +
      '<div class="card-prices">' +
        '<span class="card-price-val">' + formatPrice(baselinePrice) + '</span>' +
        '<span class="arrow-connector">\u2192</span>' +
        '<span class="card-price-val">' + formatPrice(currentPrice) + '</span>' +
      '</div>' +
      '<div class="badge badge-animate ' + dirClass + '">' +
        '<span class="arrow">' + arrow + '</span>' +
        formatPct(pct) +
      '</div>' +
      '<div class="dollar-change">' + formatChange(change) + ' per gallon</div>' +
    '</div>';
  }

  function buildRegionRow(region, index) {
    var inaugPct = pctChange(region.current, region.inauguration);
    var iranPct = pctChange(region.current, region.iranWar);
    var usePct = Math.abs(iranPct) > Math.abs(inaugPct) ? iranPct : inaugPct;
    var isUp = usePct >= 0;
    var dirClass = isUp ? 'up' : 'down';
    var arrow = isUp ? '\u2191' : '\u2193';

    return '<div class="region-row animate-in" style="animation-delay: ' + (0.4 + index * 0.06) + 's">' +
      '<span class="region-name">' + region.name + '</span>' +
      '<span class="region-price">' + formatPrice(region.current) + '</span>' +
      '<span class="region-badge ' + dirClass + '">' + arrow + ' ' + formatPct(usePct) + '</span>' +
    '</div>';
  }

  function render(data, userState) {
    var widget = document.getElementById('widget');
    var nat = data.national;

    var localHTML = '';
    if (userState && data.states && data.states.length > 0) {
      var match = data.states.find(function(s) {
        return s.name.toLowerCase() === userState.toLowerCase();
      });
      if (match) {
        localHTML = buildLocalSection(match);
      }
    }

    var regionsHTML = data.regions
      .filter(function(r) { return r.current != null; })
      .map(function(r, i) { return buildRegionRow(r, i); })
      .join('');

    var sourceLabel = data.dataSource === 'AAA'
      ? 'Source: AAA &middot; Updated daily'
      : 'Source: U.S. Energy Information Administration';

    widget.innerHTML =
      '<div class="header animate-in">' +
        '<span class="header-icon">\u26FD</span>' +
        'U.S. GAS PRICE TRACKER' +
      '</div>' +

      localHTML +

      '<div class="price-section animate-in">' +
        '<div class="big-price price-animate">' +
          formatPrice(nat.current) + '<span class="unit">/gal</span>' +
        '</div>' +
        '<div class="price-subtitle">National avg \u00B7 Regular unleaded \u00B7 ' + formatDate(data.dataDate) + '</div>' +
      '</div>' +

      '<div class="comparisons">' +
        buildComparisonCard(nat.iranWar.label, nat.iranWar.price, nat.current, 0.25) +
        buildComparisonCard(nat.inauguration.label, nat.inauguration.price, nat.current, 0.35) +
      '</div>' +

      '<div class="regions-section animate-in" style="animation-delay: 0.4s">' +
        '<div class="regions-header">Regional Prices</div>' +
        regionsHTML +
      '</div>' +

      '<div class="footer animate-in" style="animation-delay: 0.7s">' +
        sourceLabel +
      '</div>';
  }

  function showError() {
    var widget = document.getElementById('widget');
    widget.innerHTML =
      '<div class="error-state">' +
        '<div class="error-icon">\u26FD</div>' +
        '<div style="font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #94a3b8;">' +
          'Price data temporarily unavailable' +
        '</div>' +
        '<div style="font-size: 12px;">Please check back later.</div>' +
      '</div>';
  }

  // Send height to parent for iframe auto-resize
  function notifyHeight() {
    var height = document.getElementById('widget').scrollHeight;
    window.parent.postMessage({ type: 'gas-tracker-resize', height: height }, '*');
  }

  // Observe size changes
  var resizeObserver = new ResizeObserver(notifyHeight);
  resizeObserver.observe(document.getElementById('widget'));

  // Fetch data and optionally geolocate the reader
  var dataPromise = fetch(DATA_URL).then(function(res) {
    if (!res.ok) throw new Error('Failed to load');
    return res.json();
  });

  var geoPromise = fetch(GEO_URL)
    .then(function(res) { return res.json(); })
    .then(function(geo) {
      if (geo.status === 'success' && geo.regionName) {
        return geo.regionName;
      }
      return null;
    })
    .catch(function() { return null; });

  Promise.all([dataPromise, geoPromise])
    .then(function(results) {
      render(results[0], results[1]);
      setTimeout(notifyHeight, 600);
    })
    .catch(function(err) {
      console.error('Gas Price Widget Error:', err);
      showError();
      setTimeout(notifyHeight, 100);
    });
})();
</script>
</body>
</html>
