<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U.S. Gas Price Tracker</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
    background: #0f1623;
    color: #e8ecf1;
    padding: 0;
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }

  .widget {
    max-width: 650px;
    margin: 0 auto;
    padding: 24px;
    background: linear-gradient(135deg, #0f1623 0%, #1a2332 100%);
    min-height: 100%;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #64748b;
  }

  .header-icon {
    font-size: 16px;
  }

  /* Big Price */
  .price-section {
    text-align: center;
    margin-bottom: 28px;
  }

  .big-price {
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, #f0f4f8 0%, #c8d6e5 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .big-price .unit {
    font-size: 28px;
    font-weight: 600;
    vertical-align: super;
  }

  .price-subtitle {
    font-size: 13px;
    color: #64748b;
    font-weight: 500;
  }

  /* Comparison Cards */
  .comparisons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }

  .card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    padding: 18px;
    transition: background 0.2s;
  }

  .card:hover {
    background: rgba(255, 255, 255, 0.06);
  }

  .card-label {
    font-size: 11px;
    font-weight: 600;
    color: #8896a7;
    line-height: 1.5;
    margin-bottom: 14px;
    min-height: 50px;
  }

  .card-prices {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 13px;
    color: #94a3b8;
  }

  .card-prices .arrow-connector {
    color: #475569;
  }

  .card-price-val {
    font-weight: 700;
    color: #cbd5e1;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 14px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .badge.up {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }

  .badge.down {
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.2);
  }

  .badge .arrow {
    font-size: 14px;
  }

  .dollar-change {
    font-size: 12px;
    color: #64748b;
    margin-top: 6px;
    font-weight: 500;
  }

  /* Regions */
  .regions-section {
    margin-bottom: 20px;
  }

  .regions-header {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #64748b;
    margin-bottom: 12px;
  }

  .region-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 4px;
    background: rgba(255, 255, 255, 0.02);
    transition: background 0.2s;
  }

  .region-row:hover {
    background: rgba(255, 255, 255, 0.05);
  }

  .region-name {
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    flex: 1;
  }

  .region-price {
    font-size: 15px;
    font-weight: 700;
    color: #e2e8f0;
    width: 70px;
    text-align: right;
  }

  .region-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
    width: 75px;
    justify-content: center;
    margin-left: 12px;
  }

  .region-badge.up {
    background: rgba(239, 68, 68, 0.12);
    color: #f87171;
  }

  .region-badge.down {
    background: rgba(34, 197, 94, 0.12);
    color: #4ade80;
  }

  /* Footer */
  .footer {
    text-align: center;
    font-size: 10px;
    color: #475569;
    padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.04);
  }

  /* Loading / Error */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #64748b;
  }

  .loading-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: #64748b;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .error-state {
    text-align: center;
    padding: 40px 20px;
    color: #64748b;
  }

  .error-state .error-icon {
    font-size: 32px;
    margin-bottom: 12px;
  }

  /* Animations */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-in {
    animation: fadeInUp 0.4s ease-out forwards;
    opacity: 0;
  }

  .animate-in:nth-child(1) { animation-delay: 0.05s; }
  .animate-in:nth-child(2) { animation-delay: 0.15s; }
  .animate-in:nth-child(3) { animation-delay: 0.25s; }
  .animate-in:nth-child(4) { animation-delay: 0.35s; }
  .animate-in:nth-child(5) { animation-delay: 0.45s; }

  @keyframes countUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .price-animate {
    animation: countUp 0.5s ease-out 0.1s forwards;
    opacity: 0;
  }

  @keyframes badgePop {
    0% { transform: scale(0.8); opacity: 0; }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }

  .badge-animate {
    animation: badgePop 0.4s ease-out 0.3s forwards;
    opacity: 0;
  }

  /* Responsive */
  @media (max-width: 500px) {
    .widget {
      padding: 18px 16px;
    }

    .big-price {
      font-size: 56px;
    }

    .big-price .unit {
      font-size: 22px;
    }

    .comparisons {
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .card-label {
      min-height: auto;
    }

    .region-row {
      padding: 8px 10px;
    }

    .region-name {
      font-size: 12px;
    }

    .region-price {
      font-size: 14px;
      width: 60px;
    }

    .region-badge {
      width: 68px;
      font-size: 11px;
      margin-left: 8px;
    }
  }
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div>Loading gas prices&hellip;</div>
  </div>
</div>

<script>
(function() {
  const DATA_URL = './data/gas-prices.json';

  function formatPrice(price) {
    return '$' + price.toFixed(2);
  }

  function formatPct(pct) {
    return Math.abs(pct).toFixed(1) + '%';
  }

  function formatChange(change) {
    const prefix = change >= 0 ? '+' : '-';
    return prefix + '$' + Math.abs(change).toFixed(2);
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  function pctChange(current, baseline) {
    return ((current - baseline) / baseline) * 100;
  }

  function buildComparisonCard(label, baselinePrice, currentPrice, animDelay) {
    const change = currentPrice - baselinePrice;
    const pct = pctChange(currentPrice, baselinePrice);
    const isUp = change >= 0;
    const dirClass = isUp ? 'up' : 'down';
    const arrow = isUp ? '↑' : '↓';

    return `
      <div class="card animate-in" style="animation-delay: ${animDelay}s">
        <div class="card-label">${label}</div>
        <div class="card-prices">
          <span class="card-price-val">${formatPrice(baselinePrice)}</span>
          <span class="arrow-connector">→</span>
          <span class="card-price-val">${formatPrice(currentPrice)}</span>
        </div>
        <div class="badge badge-animate ${dirClass}">
          <span class="arrow">${arrow}</span>
          ${formatPct(pct)}
        </div>
        <div class="dollar-change">${formatChange(change)} per gallon</div>
      </div>
    `;
  }

  function buildRegionRow(region, index) {
    // Use the more dramatic change for the badge
    const inaugPct = pctChange(region.current, region.inauguration);
    const iranPct = pctChange(region.current, region.iranWar);
    const usePct = Math.abs(iranPct) > Math.abs(inaugPct) ? iranPct : inaugPct;
    const isUp = usePct >= 0;
    const dirClass = isUp ? 'up' : 'down';
    const arrow = isUp ? '↑' : '↓';

    return `
      <div class="region-row animate-in" style="animation-delay: ${0.4 + index * 0.06}s">
        <span class="region-name">${region.name}</span>
        <span class="region-price">${formatPrice(region.current)}</span>
        <span class="region-badge ${dirClass}">${arrow} ${formatPct(usePct)}</span>
      </div>
    `;
  }

  function render(data) {
    const widget = document.getElementById('widget');
    const nat = data.national;

    const regionsHTML = data.regions.map((r, i) => buildRegionRow(r, i)).join('');

    widget.innerHTML = `
      <div class="header animate-in">
        <span class="header-icon">⛽</span>
        U.S. GAS PRICE TRACKER
      </div>

      <div class="price-section animate-in">
        <div class="big-price price-animate">
          ${formatPrice(nat.current)}<span class="unit">/gal</span>
        </div>
        <div class="price-subtitle">Regular unleaded · Data as of ${formatDate(data.eiaDataDate)}</div>
      </div>

      <div class="comparisons">
        ${buildComparisonCard(nat.iranWar.label, nat.iranWar.price, nat.current, 0.25)}
        ${buildComparisonCard(nat.inauguration.label, nat.inauguration.price, nat.current, 0.35)}
      </div>

      <div class="regions-section animate-in" style="animation-delay: 0.4s">
        <div class="regions-header">Regional Prices</div>
        ${regionsHTML}
      </div>

      <div class="footer animate-in" style="animation-delay: 0.7s">
        Source: U.S. Energy Information Administration
      </div>
    `;
  }

  function showError() {
    const widget = document.getElementById('widget');
    widget.innerHTML = `
      <div class="error-state">
        <div class="error-icon">⛽</div>
        <div style="font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #94a3b8;">
          Price data temporarily unavailable
        </div>
        <div style="font-size: 12px;">Please check back later.</div>
      </div>
    `;
  }

  // Send height to parent for iframe auto-resize
  function notifyHeight() {
    var height = document.getElementById('widget').scrollHeight;
    window.parent.postMessage({ type: 'gas-tracker-resize', height: height }, '*');
  }

  // Observe size changes
  var resizeObserver = new ResizeObserver(notifyHeight);
  resizeObserver.observe(document.getElementById('widget'));

  fetch(DATA_URL)
    .then(function(res) {
      if (!res.ok) throw new Error('Failed to load');
      return res.json();
    })
    .then(function(data) {
      render(data);
      // Notify after animations settle
      setTimeout(notifyHeight, 600);
    })
    .catch(function(err) {
      console.error('Gas Price Widget Error:', err);
      showError();
      setTimeout(notifyHeight, 100);
    });
})();
</script>
</body>
</html>
