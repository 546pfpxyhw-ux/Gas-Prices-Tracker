<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U.S. Gas Price Tracker</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
    color: #1e293b;
    padding: 0;
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }

  .widget {
    max-width: 650px;
    margin: 0 auto;
    padding: 24px;
    background: #ffffff;
    min-height: 100%;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #94a3b8;
  }

  .header-icon {
    font-size: 16px;
  }

  /* Local price callout */
  .local-section {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.06) 0%, rgba(139, 92, 246, 0.04) 100%);
    border: 1px solid rgba(99, 102, 241, 0.15);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 22px;
    text-align: center;
  }

  .local-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #6366f1;
    margin-bottom: 6px;
  }

  .local-price {
    font-size: 40px;
    font-weight: 800;
    color: #312e81;
    line-height: 1.1;
  }

  .local-price .local-unit {
    font-size: 16px;
    font-weight: 600;
    vertical-align: super;
    color: #6366f1;
  }

  .local-change {
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 12px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 700;
  }

  .local-change.up {
    background: rgba(239, 68, 68, 0.1);
    color: #dc2626;
  }

  .local-change.down {
    background: rgba(34, 197, 94, 0.1);
    color: #16a34a;
  }

  .local-vs {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 4px;
  }

  /* Big Price */
  .price-section {
    text-align: center;
    margin-bottom: 28px;
  }

  .price-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #64748b;
    margin-bottom: 6px;
  }

  .big-price {
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    color: #0f172a;
    margin-bottom: 8px;
  }

  .big-price .unit {
    font-size: 28px;
    font-weight: 600;
    vertical-align: super;
  }

  .price-subtitle {
    font-size: 13px;
    color: #94a3b8;
    font-weight: 500;
  }

  /* Comparison Cards */
  .comparisons {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }

  .card {
    padding: 8px 24px 24px;
    text-align: center;
  }

  .card-label {
    font-size: 15px;
    font-weight: 700;
    color: #334155;
    line-height: 1.4;
    margin-bottom: 16px;
  }

  .card-prices {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
    font-size: 16px;
    color: #64748b;
  }

  .card-prices .arrow-connector {
    color: #94a3b8;
  }

  .card-price-val {
    font-weight: 700;
    font-size: 18px;
    color: #334155;
  }

  /* Splashy percentage badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 50px;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1;
    position: relative;
  }

  .badge.up {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.08) 0%, rgba(220, 38, 38, 0.15) 100%);
    color: #dc2626;
    border: 2px solid rgba(239, 68, 68, 0.25);
    box-shadow: 0 4px 16px rgba(239, 68, 68, 0.12);
  }

  .badge.down {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.08) 0%, rgba(22, 163, 74, 0.15) 100%);
    color: #16a34a;
    border: 2px solid rgba(34, 197, 94, 0.25);
    box-shadow: 0 4px 16px rgba(34, 197, 94, 0.12);
  }

  .badge .arrow {
    font-size: 28px;
  }

  .dollar-change {
    font-size: 14px;
    color: #94a3b8;
    margin-top: 12px;
    font-weight: 500;
  }

  /* Regions */
  .regions-section {
    margin-bottom: 20px;
  }

  .regions-header {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #94a3b8;
    margin-bottom: 12px;
  }

  .region-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 4px;
    background: #f8fafc;
    transition: background 0.2s;
  }

  .region-row:hover {
    background: #f1f5f9;
  }

  .region-name {
    font-size: 13px;
    font-weight: 600;
    color: #475569;
    flex: 1;
  }

  .region-price {
    font-size: 15px;
    font-weight: 700;
    color: #1e293b;
    width: 70px;
    text-align: right;
  }

  .region-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
    width: 75px;
    justify-content: center;
    margin-left: 12px;
  }

  .region-badge.up {
    background: rgba(239, 68, 68, 0.08);
    color: #dc2626;
  }

  .region-badge.down {
    background: rgba(34, 197, 94, 0.08);
    color: #16a34a;
  }

  /* Footer */
  .footer {
    text-align: center;
    font-size: 10px;
    color: #94a3b8;
    padding-top: 8px;
    border-top: 1px solid #e2e8f0;
  }

  /* Loading / Error */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #94a3b8;
  }

  .loading-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #e2e8f0;
    border-top-color: #94a3b8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .error-state {
    text-align: center;
    padding: 40px 20px;
    color: #94a3b8;
  }

  .error-state .error-icon {
    font-size: 32px;
    margin-bottom: 12px;
  }

  /* Animations */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-in {
    animation: fadeInUp 0.4s ease-out forwards;
    opacity: 0;
  }

  @keyframes countUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .price-animate {
    animation: countUp 0.5s ease-out 0.1s forwards;
    opacity: 0;
  }

  @keyframes badgePop {
    0% { transform: scale(0.6); opacity: 0; }
    50% { transform: scale(1.1); }
    70% { transform: scale(0.95); }
    100% { transform: scale(1); opacity: 1; }
  }

  .badge-animate {
    animation: badgePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
    opacity: 0;
  }

  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 4px 16px rgba(239, 68, 68, 0.12); }
    50% { box-shadow: 0 4px 24px rgba(239, 68, 68, 0.22); }
  }

  @keyframes glowPulseGreen {
    0%, 100% { box-shadow: 0 4px 16px rgba(34, 197, 94, 0.12); }
    50% { box-shadow: 0 4px 24px rgba(34, 197, 94, 0.22); }
  }

  .badge.up.badge-animate {
    animation: badgePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards,
               glowPulse 2s ease-in-out 0.8s infinite;
  }

  .badge.down.badge-animate {
    animation: badgePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards,
               glowPulseGreen 2s ease-in-out 0.8s infinite;
  }

  /* Responsive */
  @media (max-width: 500px) {
    .widget {
      padding: 18px 16px;
    }

    .big-price {
      font-size: 56px;
    }

    .big-price .unit {
      font-size: 22px;
    }

    .comparisons {
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .badge {
      font-size: 28px;
      padding: 10px 20px;
    }

    .badge .arrow {
      font-size: 22px;
    }

    .card-price-val {
      font-size: 16px;
    }

    .local-price {
      font-size: 32px;
    }

    .region-row {
      padding: 8px 10px;
    }

    .region-name {
      font-size: 12px;
    }

    .region-price {
      font-size: 14px;
      width: 60px;
    }

    .region-badge {
      width: 68px;
      font-size: 11px;
      margin-left: 8px;
    }
  }
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div>Loading gas prices&hellip;</div>
  </div>
</div>

<script>
(function() {
  var DATA_URL = './data/gas-prices.json';
  var GEO_URL = 'https://ipapi.co/json/';

  function formatPrice(price) {
    return '$' + price.toFixed(2);
  }

  function formatPct(pct) {
    return Math.abs(pct).toFixed(1) + '%';
  }

  function formatChange(change) {
    var prefix = change >= 0 ? '+' : '-';
    return prefix + '$' + Math.abs(change).toFixed(2);
  }

  function formatDate(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  function pctChange(current, baseline) {
    return ((current - baseline) / baseline) * 100;
  }

  function buildLocalSection(state) {
    var iranPct = pctChange(state.current, state.iranWar);
    var isUp = iranPct >= 0;
    var dirClass = isUp ? 'up' : 'down';
    var arrow = isUp ? '\u2191' : '\u2193';

    return '<div class="local-section animate-in" style="animation-delay: 0.08s">' +
      '<div class="local-label">\uD83D\uDCCD Gas in ' + state.name + '</div>' +
      '<div class="local-price">' + formatPrice(state.current) + '<span class="local-unit">/gal</span></div>' +
      '<div class="local-change ' + dirClass + '">' + arrow + ' ' + formatPct(iranPct) + ' since Iran war</div>' +
      '<div class="local-vs">vs. ' + formatPrice(state.iranWar) + ' regional average on Feb 27</div>' +
    '</div>';
  }

  function buildComparisonCard(label, baselinePrice, currentPrice, animDelay) {
    var change = currentPrice - baselinePrice;
    var pct = pctChange(currentPrice, baselinePrice);
    var isUp = change >= 0;
    var dirClass = isUp ? 'up' : 'down';
    var arrow = isUp ? '\u2191' : '\u2193';

    return '<div class="card animate-in" style="animation-delay: ' + animDelay + 's">' +
      '<div class="card-label">' + label + '</div>' +
      '<div class="card-prices">' +
        '<span class="card-price-val">' + formatPrice(baselinePrice) + '</span>' +
        '<span class="arrow-connector">\u2192</span>' +
        '<span class="card-price-val">' + formatPrice(currentPrice) + '</span>' +
      '</div>' +
      '<div class="badge badge-animate ' + dirClass + '">' +
        '<span class="arrow">' + arrow + '</span>' +
        formatPct(pct) +
      '</div>' +
      '<div class="dollar-change">' + formatChange(change) + ' per gallon</div>' +
    '</div>';
  }

  function buildRegionRow(region, index) {
    var iranPct = pctChange(region.current, region.iranWar);
    var usePct = iranPct;
    var isUp = usePct >= 0;
    var dirClass = isUp ? 'up' : 'down';
    var arrow = isUp ? '\u2191' : '\u2193';

    return '<div class="region-row animate-in" style="animation-delay: ' + (0.4 + index * 0.06) + 's">' +
      '<span class="region-name">' + region.name + '</span>' +
      '<span class="region-price">' + formatPrice(region.current) + '</span>' +
      '<span class="region-badge ' + dirClass + '">' + arrow + ' ' + formatPct(usePct) + '</span>' +
    '</div>';
  }

  function render(data, userState) {
    var widget = document.getElementById('widget');
    var nat = data.national;

    var localHTML = '';
    if (userState && data.states && data.states.length > 0) {
      var match = data.states.find(function(s) {
        return s.name.toLowerCase() === userState.toLowerCase();
      });
      if (match) {
        localHTML = buildLocalSection(match);
      }
    }

    var regionsHTML = data.regions
      .filter(function(r) { return r.current != null; })
      .map(function(r, i) { return buildRegionRow(r, i); })
      .join('');

    var updatedDate = data.lastUpdated
      ? new Date(data.lastUpdated).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
      : null;
    var sourceLabel = 'Source: ' + (data.dataSource === 'AAA' ? 'AAA' : 'U.S. Energy Information Administration') +
      (updatedDate ? ' &middot; Last updated ' + updatedDate : '');

    widget.innerHTML =
      localHTML +

      '<div class="price-section animate-in">' +
        '<div class="price-label">\u26FD U.S. National Average \u00B7 ' + formatDate(data.dataDate) + '</div>' +
        '<div class="big-price price-animate">' +
          formatPrice(nat.current) + '<span class="unit">/gal</span>' +
        '</div>' +
        '<div class="price-subtitle">Regular unleaded</div>' +
      '</div>' +

      '<div class="comparisons">' +
        (function() {
          var iranPct = pctChange(nat.current, nat.iranWar.price);
          var yikes = Math.abs(iranPct) > 20 ? 'YIKES: ' : '';
          var label = nat.current >= nat.iranWar.price
            ? yikes + "Here's how much gas prices have spiked nationwide since Trump launched his war with Iran"
            : yikes + "Here's how much gas prices have dropped nationwide since Trump launched his war with Iran";
          return buildComparisonCard(label, nat.iranWar.price, nat.current, 0.25);
        })() +
      '</div>' +

      '<div class="regions-section animate-in" style="animation-delay: 0.4s">' +
        '<div class="regions-header">Regional Prices</div>' +
        regionsHTML +
      '</div>' +

      '<div class="footer animate-in" style="animation-delay: 0.7s">' +
        sourceLabel +
      '</div>';
  }

  function showError() {
    var widget = document.getElementById('widget');
    widget.innerHTML =
      '<div class="error-state">' +
        '<div class="error-icon">\u26FD</div>' +
        '<div style="font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #475569;">' +
          'Price data temporarily unavailable' +
        '</div>' +
        '<div style="font-size: 12px;">Please check back later.</div>' +
      '</div>';
  }

  // Send height to parent for iframe auto-resize
  function notifyHeight() {
    var height = document.getElementById('widget').scrollHeight;
    window.parent.postMessage({ type: 'gas-tracker-resize', height: height }, '*');
  }

  // Observe size changes
  var resizeObserver = new ResizeObserver(notifyHeight);
  resizeObserver.observe(document.getElementById('widget'));

  // Fetch data and optionally geolocate the reader
  var dataPromise = fetch(DATA_URL).then(function(res) {
    if (!res.ok) throw new Error('Failed to load');
    return res.json();
  });

  var geoPromise = fetch(GEO_URL)
    .then(function(res) { return res.json(); })
    .then(function(geo) {
      if (geo.region) {
        return geo.region;
      }
      return null;
    })
    .catch(function() { return null; });

  Promise.all([dataPromise, geoPromise])
    .then(function(results) {
      render(results[0], results[1]);
      setTimeout(notifyHeight, 600);
    })
    .catch(function(err) {
      console.error('Gas Price Widget Error:', err);
      showError();
      setTimeout(notifyHeight, 100);
    });
})();
</script>
</body>
</html>
